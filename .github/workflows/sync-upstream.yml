name: Sync main with boykopovar/AnyPS5

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main to upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main --source boykopovar/AnyPS5
